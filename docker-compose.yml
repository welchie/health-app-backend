services:
  postgres:
    image: postgres:15-alpine
    container_name: healthapp-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: healthapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecurepassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: healthapp-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/healthapp
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecurepassword
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
